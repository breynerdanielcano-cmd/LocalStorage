<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <!-- Titulo -->
            <div class="div col-12">
                <h1 class="text-center my-3 text-primary"> Listado de productos</h1>
            </div>
            <!-- Formulario -->
            <div class="div col-6">
<form>
  <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Nombre Producto</label>
      <input type="text" class="form-control" id="nombre-pro">
  </div>
   <div class="mb-3">
      <label for="precio-pro" class="form-label">Precio Producto</label>
      <input type="number" class="form-control" id="precio-pro">
  </div>
   <div class="mb-3">
      <label for="drescripcion-pro" class="form-label">Drescripcion Producto</label>
      <input type="text" class="form-control" id="descripcion-pro">
  </div>
   <div class="mb-3">
      <label for="imagen" class="form-label">Imagen Producto</label>
      <input type="url" class="form-control" id="imagen-pro">
  </div>

      <button type="button" class="btn btn-primary btn-guardar" >Guarda Producto</button>
</form>
            </div>
            <!-- Listado -->
            <div class="col-8"></div>
        </div>
    </div>


    <script src="LocalStorage.js"></script>
</body>
</html>
